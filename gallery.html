<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Chandaria Converting FC | Gallery - Moments & Memories</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%230A2463' stroke='%23D62828' stroke-width='6'/%3E%3Ctext x='50' y='72' font-size='58' text-anchor='middle' fill='%23F7B731' font-family='Bebas Neue, sans-serif' font-weight='bold'%3EC%3C/text%3E%3C/svg%3E">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --blue: #0A2463;
      --red: #D62828;
      --gold: #F7B731;
      --light: #F4F3EE;
      --dark: #111111;
      --card: #ffffff;
      --border: #E2DFD6;
      --muted: #6B6B6B;
      --radius: 12px;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--light);
      color: var(--dark);
      line-height: 1.5;
      overflow-x: hidden;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: rgba(10, 36, 99, 0.9);
      backdrop-filter: blur(20px);
      border-bottom: 2px solid var(--red);
      transition: all 0.3s ease;
    }

    .nav-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.25rem;
      height: 64px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .nav-logo img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: contain;
      border: 2px solid var(--red);
    }

    .nav-logo span {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.5rem;
      color: #fff;
      letter-spacing: 2px;
    }

    .hamburger {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #fff;
      font-size: 1.6rem;
      cursor: pointer;
      width: 44px;
      height: 44px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-links-desktop {
      display: none;
      gap: 8px;
    }

    .nav-links-desktop a {
      color: rgba(255, 255, 255, 0.85);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      padding: 8px 16px;
      border-radius: 40px;
      transition: all 0.2s;
    }

    .nav-links-desktop a:hover,
    .nav-links-desktop a.active {
      background: var(--red);
      color: #fff;
    }

    .nav-drawer {
      display: none;
      flex-direction: column;
      background: rgba(10, 36, 99, 0.98);
      backdrop-filter: blur(16px);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .nav-drawer.open {
      display: flex;
      animation: fadeIn 0.2s ease;
    }

    .nav-drawer a {
      color: rgba(255, 255, 255, 0.85);
      text-decoration: none;
      padding: 14px 1.8rem;
      font-size: 1rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .nav-drawer a:hover {
      background: var(--red);
      color: #fff;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .gallery-hero {
      background: linear-gradient(145deg, var(--blue) 0%, #061845 70%);
      padding: 7rem 1.25rem 3rem;
      text-align: center;
      color: white;
    }

    .gallery-hero h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2.5rem, 8vw, 4rem);
      letter-spacing: 3px;
      margin-bottom: 0.5rem;
    }

    .gallery-hero p {
      font-size: 1rem;
      opacity: 0.85;
    }

    main {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem 1.25rem 4rem;
    }

    .filter-bar {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 2.5rem;
    }

    .filter-btn {
      background: transparent;
      border: 1px solid var(--border);
      padding: 0.6rem 1.5rem;
      border-radius: 40px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
      color: var(--dark);
    }

    .filter-btn.active,
    .filter-btn:hover {
      background: var(--blue);
      border-color: var(--blue);
      color: white;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
    }

    .gallery-card {
      background: var(--card);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
      border: 1px solid var(--border);
    }

    .gallery-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 35px rgba(10, 36, 99, 0.15);
      border-color: var(--gold);
    }

    .gallery-img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      display: block;
      transition: transform 0.5s ease;
    }

    .gallery-card:hover .gallery-img {
      transform: scale(1.03);
    }

    .card-info {
      padding: 1.2rem;
    }

    .card-info h3 {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }

    .card-info .date {
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .tag {
      background: rgba(10, 36, 99, 0.08);
      color: var(--blue);
      font-size: 0.7rem;
      padding: 0.2rem 0.7rem;
      border-radius: 20px;
      font-weight: 500;
    }

    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(12px);
      z-index: 3000;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox-content {
      max-width: 85vw;
      max-height: 80vh;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    .lightbox-info {
      background: rgba(0, 0, 0, 0.6);
      margin-top: 1rem;
      padding: 0.8rem 1.5rem;
      border-radius: 40px;
      color: white;
      text-align: center;
    }

    .lightbox-info h3 {
      font-size: 1.2rem;
    }

    .lightbox-nav {
      position: absolute;
      top: 50%;
      width: 100%;
      transform: translateY(-50%);
      display: flex;
      justify-content: space-between;
      padding: 0 2rem;
      pointer-events: none;
    }

    .lightbox-nav button {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      font-size: 1.8rem;
      cursor: pointer;
      color: white;
      backdrop-filter: blur(4px);
      pointer-events: auto;
      transition: all 0.2s;
    }

    .lightbox-nav button:hover {
      background: var(--red);
      transform: scale(1.05);
    }

    .close-lightbox {
      position: absolute;
      top: 20px;
      right: 30px;
      font-size: 2rem;
      color: white;
      cursor: pointer;
      background: none;
      border: none;
      z-index: 3100;
    }

    .close-lightbox:hover {
      color: var(--gold);
    }

    footer {
      background: var(--blue);
      color: rgba(255, 255, 255, 0.8);
      text-align: center;
      padding: 1.8rem;
      border-top: 3px solid var(--red);
      font-size: 0.85rem;
    }

    .tab-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(10, 36, 99, 0.96);
      backdrop-filter: blur(20px);
      display: flex;
      z-index: 200;
      border-top: 1px solid var(--red);
      padding-bottom: env(safe-area-inset-bottom);
    }

    .tab-btn {
      flex: 1;
      text-align: center;
      padding: 8px 0;
      color: rgba(255, 255, 255, 0.7);
      text-decoration: none;
      font-size: 0.6rem;
      font-weight: 600;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .tab-btn .ti {
      font-size: 1.2rem;
    }

    .tab-btn.active,
    .tab-btn:hover {
      color: var(--gold);
    }

    @media (min-width: 768px) {
      .hamburger { display: none; }
      .nav-links-desktop { display: flex; }
      .tab-bar { display: none; }
    }

    @media (max-width: 640px) {
      .gallery-grid {
        grid-template-columns: 1fr;
      }
      .lightbox-nav button {
        width: 40px;
        height: 40px;
        font-size: 1.2rem;
      }
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --light: #121212;
        --card: #1e1e2a;
        --border: #2c2c3a;
        --dark: #eee;
      }
      .tag {
        background: rgba(247, 183, 49, 0.15);
        color: var(--gold);
      }
    }
  </style>
</head>
<body>

<header id="mainHeader">
  <div class="nav-top">
    <a class="nav-logo" href="index.html" target="_self">
      <img src="logo.png" alt="CCFC" onerror="this.style.display='none'">
      <span>C.C.F.C</span>
    </a>
    <nav class="nav-links-desktop">
      <a href="index.html" target="_self">Home</a>
      <a href="team.html" target="_self">Team</a>
      <a href="Gallery.html" class="active" target="_self">Gallery</a>
      <a href="finance.html" target="_self">Finance</a>
      <a href="fixtures.html" target="_self">Fixtures</a>
      <a href="contact.html" target="_self">Contact</a>
    </nav>
    <button class="hamburger" id="hamburger">☰</button>
  </div>
  <nav class="nav-drawer" id="nav-drawer">
    <a href="index.html" target="_self">🏠 Home</a>
    <a href="team.html" target="_self">👥 Team</a>
    <a href="Gallery.html" target="_self">📸 Gallery</a>
    <a href="finance.html" target="_self">💰 Finance</a>
    <a href="fixtures.html" target="_self">📅 Fixtures</a>
    <a href="contact.html" target="_self">📞 Contact</a>
  </nav>
</header>

<div class="gallery-hero">
  <h1>Our Visual Journey</h1>
  <p>Every goal, every cheer, every memory — in frames</p>
</div>

<main>
  <div class="filter-bar">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="matches">Matches</button>
    <button class="filter-btn" data-filter="training">Training</button>
    <button class="filter-btn" data-filter="team-building">Team Building</button>
    <button class="filter-btn" data-filter="celebrations">Celebrations</button>
  </div>

  <div class="gallery-grid" id="galleryGrid"></div>
</main>

<footer>
  <p>© <span id="currentYear"></span> <strong>Chandaria Converting Football Club</strong> · Together as One 💙❤️</p>
</footer>

<div class="tab-bar">
  <a class="tab-btn" href="index.html" target="_self"><span class="ti">🏠</span>Home</a>
  <a class="tab-btn" href="fixtures.html" target="_self"><span class="ti">📅</span>Fixtures</a>
  <a class="tab-btn" href="team.html" target="_self"><span class="ti">👥</span>Team</a>
  <a class="tab-btn active" href="Gallery.html" target="_self"><span class="ti">📸</span>Gallery</a>
  <a class="tab-btn" href="finance.html" target="_self"><span class="ti">💰</span>Finance</a>
  <a class="tab-btn" href="contact.html" target="_self"><span class="ti">📞</span>Contact</a>
</div>

<div id="lightbox" class="lightbox">
  <button class="close-lightbox" id="closeLightboxBtn">✕</button>
  <div class="lightbox-nav">
    <button id="prevBtn">‹</button>
    <button id="nextBtn">›</button>
  </div>
  <img class="lightbox-content" id="lightboxImg" alt="Expanded view">
  <div class="lightbox-info" id="lightboxInfo">
    <h3 id="lbTitle"></h3>
    <div class="tags" id="lbTags"></div>
  </div>
</div>

<script>
  // ========== REPLACE THESE WITH YOUR ACTUAL LOCAL IMAGE PATHS ==========
  // Example: "images/match1.jpg", "gallery/celebration.png", etc.
  // You can add/remove items as needed. Keep the structure.
  const galleryData = [
    { src: "images/match_victory.jpg", title: "Victory Against Rivals", date: "Oct 15, 2025", category: "matches", tags: ["Match", "Victory", "Action"] },
    { src: "images/winning_goal.jpg", title: "Winning Goal Celebration", date: "Sep 22, 2025", category: "matches", tags: ["Goal", "Celebration", "Team Spirit"] },
    { src: "images/training_intense.jpg", title: "Intensive Training Session", date: "Aug 30, 2025", category: "training", tags: ["Training", "Fitness", "Teamwork"] },
    { src: "images/skills_dev.jpg", title: "Skills Development", date: "Jul 18, 2025", category: "training", tags: ["Training", "Skills", "Development"] },
    { src: "images/team_meeting.jpg", title: "Tactical Team Meeting", date: "Jun 10, 2025", category: "team-building", tags: ["Team Building", "Strategy", "Planning"] },
    { src: "images/bonding.jpg", title: "Team Bonding Activity", date: "May 5, 2025", category: "team-building", tags: ["Team Building", "Bonding", "Fun"] },
    { src: "images/trophy_celebration.jpg", title: "League Trophy Celebration", date: "Apr 28, 2025", category: "celebrations", tags: ["Celebration", "Trophy", "Achievement"] },
    { src: "images/player_award.jpg", title: "Player of the Month Award", date: "Mar 15, 2025", category: "celebrations", tags: ["Celebration", "Award", "Recognition"] }
  ];
  // ====================================================================

  let currentLightboxIndex = 0;
  const gridContainer = document.getElementById('galleryGrid');
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');
  const lbTitle = document.getElementById('lbTitle');
  const lbTags = document.getElementById('lbTags');

  function renderGallery(filter = 'all') {
    gridContainer.innerHTML = '';
    const filtered = galleryData.filter(item => filter === 'all' || item.category === filter);
    filtered.forEach((item, idx) => {
      const card = document.createElement('div');
      card.className = 'gallery-card';
      card.setAttribute('data-idx', idx);
      card.innerHTML = `
        <img class="gallery-img" src="${item.src}" alt="${item.title}" loading="lazy" onerror="this.src='fallback-image.png'; this.onerror=null;">
        <div class="card-info">
          <h3>${item.title}</h3>
          <div class="date">${item.date}</div>
          <div class="tags">${item.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
        </div>
      `;
      card.addEventListener('click', () => openLightbox(idx));
      gridContainer.appendChild(card);
    });
  }

  function openLightbox(index) {
    currentLightboxIndex = index;
    updateLightboxContent();
    lightbox.classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  function updateLightboxContent() {
    const item = galleryData[currentLightboxIndex];
    lightboxImg.src = item.src;
    lbTitle.innerText = item.title;
    lbTags.innerHTML = item.tags.map(t => `<span class="tag">${t}</span>`).join('');
  }

  function closeLightbox() {
    lightbox.classList.remove('active');
    document.body.style.overflow = '';
  }

  function nextImage() {
    currentLightboxIndex = (currentLightboxIndex + 1) % galleryData.length;
    updateLightboxContent();
  }

  function prevImage() {
    currentLightboxIndex = (currentLightboxIndex - 1 + galleryData.length) % galleryData.length;
    updateLightboxContent();
  }

  // Filter buttons
  const filterBtns = document.querySelectorAll('.filter-btn');
  filterBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      filterBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderGallery(btn.dataset.filter);
    });
  });

  // Lightbox controls
  document.getElementById('closeLightboxBtn').addEventListener('click', closeLightbox);
  document.getElementById('prevBtn').addEventListener('click', prevImage);
  document.getElementById('nextBtn').addEventListener('click', nextImage);
  lightbox.addEventListener('click', (e) => {
    if (e.target === lightbox) closeLightbox();
  });
  document.addEventListener('keydown', (e) => {
    if (!lightbox.classList.contains('active')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') prevImage();
    if (e.key === 'ArrowRight') nextImage();
  });

  // Dynamic copyright year
  document.getElementById('currentYear').innerText = new Date().getFullYear();

  // Mobile drawer and header scroll
  const hamburger = document.getElementById('hamburger');
  const drawer = document.getElementById('nav-drawer');
  hamburger.addEventListener('click', () => {
    drawer.classList.toggle('open');
    hamburger.innerHTML = drawer.classList.contains('open') ? '✕' : '☰';
  });
  window.addEventListener('scroll', () => {
    const headerEl = document.getElementById('mainHeader');
    if (window.scrollY > 20) headerEl.style.background = 'rgba(10, 36, 99, 0.98)';
    else headerEl.style.background = 'rgba(10, 36, 99, 0.9)';
  });

  // Initial render
  renderGallery('all');
</script>
</body>
</html>
